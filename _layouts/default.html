<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.url == '/' %}Wenrui Huang — Mathematics, Brown University{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}" />
  <meta name="author" content="Wenrui Huang" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
{% if page.url == '/' %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Wenrui Huang",
    "url": "https://whuang58.github.io/",
    "jobTitle": "PhD student in Mathematics",
    "affiliation": { "@type": "CollegeOrUniversity", "name": "Brown University" },
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "University of Science and Technology of China" },
    "knowsAbout": ["Partial differential equations", "Kinetic equations", "Dispersive equations", "Vlasov–Poisson system"]
  }
  </script>
{% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="masthead-inner">
      <img class="portrait" src="{{ '/wenrui-portrait.jpg' | relative_url }}" width="480" height="600" alt="Portrait of Wenrui Huang">
      <div class="masthead-text">
        <h1 class="name">Wenrui Huang</h1>
        <p class="role">PhD student, Department of Mathematics, Brown University</p>
        <p class="contact">
          <a href="{{ '/CV_hwr.pdf' | relative_url }}">CV</a>
          <span class="email">wenrui_huang [at] brown.edu</span>
        </p>
      </div>
      <nav class="nav" aria-label="Pages">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/teaching/' | relative_url }}"{% if page.url == '/teaching/' %} aria-current="page"{% endif %}>Teaching</a>
        <a href="{{ '/talks/' | relative_url }}"{% if page.url == '/talks/' %} aria-current="page"{% endif %}>Talks</a>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    {{ content }}
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />
  <meta name="author" content="Wenrui Huang" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="site-shell">
    <header class="hero">
      <div class="hero-copy">
        <div class="hero-heading">
          <h1 class="title">Wenrui Huang</h1>
          <nav aria-label="Primary" class="nav">
            <a href="#about">About</a>
            <a href="#publications--preprints">Publications &amp; Preprints</a>
            <a href="#teaching">Teaching</a>
            <a href="#talks">Talks</a>
          </nav>
        </div>
        <p class="subtitle">PhD Student · Department of Mathematics, Brown University</p>
      </div>
    </header>

    <main id="main" class="markdown-body">
      {{ content }}
    </main>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />
  <meta name="author" content="Wenrui Huang" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="page">
    <header class="masthead">
      <div class="masthead-text">
        <h1 class="name">Wenrui Huang</h1>
        <p class="role">PhD student, Department of Mathematics, Brown University</p>
        <p class="contact">
          <a href="{{ '/CV_hwr.pdf' | relative_url }}">CV</a>
          <span class="email">wenrui_huang [at] brown.edu</span>
        </p>
        <p class="market">Seeking a postdoctoral position beginning in Fall 2027.</p>
      </div>
      <img class="portrait" src="{{ '/wenrui-portrait.jpg' | relative_url }}" width="480" height="600" alt="Portrait of Wenrui Huang">
    </header>

    <main id="main">
      {{ content }}
    </main>

  </div>
</body>
</html>
